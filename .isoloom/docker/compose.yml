# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: vulhub-aria2-rce
services:
  aria2:
    image: vulhub/aria2:1.18.8
    platform: linux/amd64
    hostname: aria2
    networks:
      lab:
        ipv4_address: 10.61.37.10
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+6800}:6800
    volumes:
    - aria2-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6800
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M
    labels:
      isoloom.service.web: http:6800
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
    restart: unless-stopped
  aria2-init-1:
    image: vulhub/aria2:1.18.8
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - aria2-ctf:/ctf
    network_mode: service:aria2
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      aria2:
        condition: service_healthy
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    depends_on:
      aria2:
        condition: service_healthy
      aria2-init-1:
        condition: service_completed_successfully
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
networks:
  lab:
    ipam:
      config:
      - subnet: 10.61.37.0/24
        gateway: 10.61.37.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
volumes:
  aria2-ctf:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-aria2-rce
